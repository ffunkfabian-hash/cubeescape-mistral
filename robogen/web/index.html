<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>robogen – Einzelteil-Ansicht</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; color: #e8eaed; display: flex; height: 100vh; }
  #view { flex: 1; }
  #panel { width: 240px; padding: 12px; background: #1d2026; overflow-y: auto; }
  #panel h1 { font-size: 16px; margin: 0 0 12px; }
  .part { display: block; width: 100%; margin: 4px 0; padding: 8px; background: #2a2e36; color: #e8eaed;
          border: 1px solid #3a3f48; border-radius: 6px; cursor: pointer; text-align: left; }
  .part.active { background: #2f5d8a; border-color: #5b9bd5; }
  .row { margin: 14px 0; }
  .row label { font-size: 13px; }
  input[type=range] { width: 100%; }
  #views button { margin: 2px; padding: 6px 10px; background: #2a2e36; color: #e8eaed; border: 1px solid #3a3f48; border-radius: 6px; cursor: pointer; }
  #views button.active { background: #2f5d8a; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>robogen – hexbot</h1>
  <div class="row">
    <label>Explosionsansicht: <span id="expVal">0</span>%</label>
    <input id="explode" type="range" min="0" max="100" value="0">
  </div>
  <div class="row">
    <label>Ansicht:</label><br>
    <div id="views">
      <button data-v="iso" class="active">3D</button>
      <button data-v="front">Front</button>
      <button data-v="back">Rück</button>
      <button data-v="side">Seite</button>
      <button data-v="top">Drauf</button>
    </div>
  </div>
  <div class="row">
    <label>Einzelteil:</label>
    <button class="part active" data-p="all">Alle Teile</button>
    <div id="parts"></div>
  </div>
</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const spec = (await (await fetch('spec.json')).json()).build_spec;
const container = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 100);
camera.position.set(2.2, 1.6, 2.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88bbff, 0.7);
rim.position.set(-4, 2, -3);
scene.add(rim);

function makeMaterial(cfg) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(...cfg.base_color),
    roughness: cfg.roughness ?? 0.5,
    metalness: cfg.metallic ?? 0.0,
    emissive: cfg.emission ? new THREE.Color(...cfg.emission) : new THREE.Color(0x000000),
    emissiveIntensity: cfg.emission_strength ?? 0,
  });
}
const mats = {};
for (const [name, cfg] of Object.entries(spec.materials)) mats[name] = makeMaterial(cfg);

const root = new THREE.Group();
scene.add(root);
const partGroups = {};
const partCenters = {};

function addPrim(group, p) {
  let geo;
  if (p.type === 'cube') {
    geo = new THREE.BoxGeometry(...p.scale);
  } else if (p.type === 'uv_sphere') {
    geo = new THREE.SphereGeometry(1, 24, 16);
    const s = p.scale || [p.radius, p.radius, p.radius];
    geo.scale(...s);
  } else if (p.type === 'cylinder') {
    geo = new THREE.CylinderGeometry(p.radius, p.radius, p.depth, p.vertices || 32);
    const r = p.rot || [0, 0, 0];
    geo.rotateX(THREE.MathUtils.degToRad(r[0]));
    geo.rotateY(THREE.MathUtils.degToRad(r[1]));
    geo.rotateZ(THREE.MathUtils.degToRad(r[2]));
  }
  const mesh = new THREE.Mesh(geo, mats[p.material] || mats[Object.keys(mats)[0]]);
  mesh.position.set(...p.loc);
  if (p.bevel) {
    mesh.geometry = geo; // Bevel in three.js approximiert; Kanten bleiben scharf
  }
  group.add(mesh);
}

for (const part of spec.parts) {
  const g = new THREE.Group();
  g.name = part.id;
  let center = part.bounding_box ? part.bounding_box.center : null;
  if (!center) {
    center = [0, 0, 0];
    for (const p of part.primitives) for (let i = 0; i < 3; i++) center[i] += p.loc[i] / part.primitives.length;
  }
  g.position.set(...center);
  for (const p of part.primitives) {
    const local = p.loc.map((v, i) => v - center[i]);
    addPrim(g, { ...p, loc: local });
  }
  g.userData.center = new THREE.Vector3(...center);
  root.add(g);
  partGroups[part.id] = g;
  partCenters[part.id] = center;
}

const partsDiv = document.getElementById('parts');
let activePart = 'all';
for (const part of spec.parts) {
  const b = document.createElement('button');
  b.className = 'part';
  b.dataset.p = part.id;
  b.textContent = part.id;
  b.onclick = () => setPart(part.id);
  partsDiv.appendChild(b);
}
function setPart(id) {
  activePart = id;
  document.querySelectorAll('.part').forEach(b => b.classList.toggle('active', b.dataset.p === id));
  for (const [pid, g] of Object.entries(partGroups)) {
    g.visible = (id === 'all' || id === pid);
  }
}

const explodeSlider = document.getElementById('explode');
const expVal = document.getElementById('expVal');
function applyExplode() {
  const t = explodeSlider.value / 100;
  expVal.textContent = explodeSlider.value;
  for (const g of Object.values(partGroups)) {
    const c = g.userData.center;
    const dir = new THREE.Vector3(c[0], c[1] - 0.95, c[2]);
    if (dir.lengthSq() < 1e-6) dir.set(0, 1, 0);
    dir.normalize();
    g.position.copy(dir.multiplyScalar(t * 0.55));
  }
}
explodeSlider.oninput = applyExplode;

const views = {
  iso:  [2.2, 1.6, 2.6],
  front: [0, 1.0, 3.2],
  back: [0, 1.0, -3.2],
  side: [3.2, 1.0, 0],
  top:  [0, 4.5, 0.01],
};
document.querySelectorAll('#views button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#views button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const v = views[b.dataset.v];
    camera.position.set(...v);
    controls.target.set(0, 0.95, 0);
  };
});

addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
